<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Turning Stone Polygon (The Foundation) -->
  <polygon points="64,24 100,52 86,96 42,96 28,52" fill="#1E293B" stroke="url(#emeraldGrad)" stroke-width="3" opacity="0.8"/>
  <polygon points="64,32 92,54 80,88 48,88 36,54" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Soaring Turnstone Bird / Compass Diamond -->
  <path d="M64 18 L76 56 L112 64 L76 72 L64 110 L52 72 L16 64 L52 56 Z" fill="url(#emeraldGrad)" filter="url(#glow)"/>

  <!-- Inner Amber Core Intelligence -->
  <circle cx="64" cy="64" r="10" fill="url(#amberGrad)"/>
  <circle cx="64" cy="64" r="4" fill="#FFFBEB"/>
</svg>
