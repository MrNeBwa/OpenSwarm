# OpenSwarm configuration (auto-generated on first run at ~/.config/openswarm/swarm_config.yaml;
# a ./swarm_config.yaml in the working directory takes precedence).
# Skills, presets, prompts and the built-in workflows are generated into your file; edit or add entries by `id`.
# Missing built-ins are re-added automatically after an upgrade.

default_mode: chat          # chat | auto | storm | best | cowork | debate | research | write | review | wf:<workflow id>
max_parallel: 8             # agents at once; 0 = no limit (everything simultaneously)
max_review_rounds: 3
debate_rounds: 2            # rounds of argument/rebuttal in Debate mode
verify_command: ""          # e.g. "pytest -q": run in each worktree before merging; failures go back to the coder
fix_attempts: 2             # ... this many times
best_of_n: 3                # candidates in Best-of-N mode
max_agents_per_run: 40      # budget guards
run_timeout_minutes: 60
cleanup_on_success: true

models:                     # `openswarm doctor --live` / `--list-models` show what your opencode really offers
  - {id: google/gemini-3.5-flash,            label: "Google Gemini 3.5 Flash · OpenCode (1M)", free: true, builtin: true}
  - {id: google/gemini-3.1-flash-lite,       label: "Google Gemini 3.1 Flash-Lite · OpenCode", free: true, builtin: true}
  - {id: google/gemini-3-flash-preview,      label: "Google Gemini 3 Flash Preview · OpenCode (1M)", free: true, builtin: true}
  - {id: google/gemini-flash-latest,         label: "Google Gemini Flash Latest · OpenCode (1M)", free: true, builtin: true}
  - {id: google/gemini-pro-latest,           label: "Google Gemini Pro Latest · OpenCode (2M)", free: true, builtin: true}
  - {id: "ollama/qwen2.5-coder:7b",          label: "Ollama: qwen2.5-coder 7B (local · OpenCode)", free: true, builtin: true}
  - {id: "ollama/deepseek-r1:8b",            label: "Ollama: deepseek-r1 8B (local · OpenCode)", free: true, builtin: true}
  - {id: deepseek-harness/deepseek-flash,     label: "DeepSeek V4.1 Flash · DeepSeek Harness (Free Unlimited 1M)", free: true, builtin: false}
  - {id: opencode/deepseek-v4.1-flash-free,   label: DeepSeek V4.1 Flash Free, free: true, builtin: true}
  - {id: opencode/beam-free,                  label: Beam Free (1M ctx),      free: true, builtin: true}
  - {id: opencode/nemotron-3.5-super-vl-free, label: Nemotron 3.5 Super VL,   free: true, builtin: true}
  - {id: opencode/flint-40b-free,             label: Flint 40B Free,          free: true, builtin: true}
  - {id: opencode/nemotron-3.5-lightning-free, label: Nemotron 3.5 Lightning,  free: true, builtin: true}
  - {id: opencode/mimo-v2.6-flash-free,       label: MiMo-V2.6-Flash Free,    free: true, builtin: true}
  - {id: opencode/glm-5.3-flash-free,         label: GLM-5.3-Flash Free,      free: true, builtin: true}
  - {id: opencode/nemotron-3-ultra-free,      label: Nemotron 3 Ultra Free,   free: true, builtin: true}
  - {id: opencode/big-pickle,                 label: Big Pickle,              free: true, builtin: true}
  - {id: anthropic/claude-sonnet-4-5,         label: Claude Sonnet 4.5}
  - {id: openai/gpt-5,                        label: GPT-5}

roles:
  planner: google/gemini-3.5-flash
  architect: google/gemini-3.5-flash
  coder: google/gemini-3.5-flash
  reviewer: google/gemini-3.1-flash-lite
  diagnostician: google/gemini-3.5-flash
  chat: google/gemini-3.5-flash

security:
  sandbox: "off"            # bwrap = bubblewrap: system read-only, only the project writable, ~/.ssh etc. hidden
  sandbox_hide: [.ssh, .gnupg, .aws, .config/gcloud, .netrc, .kube]
  sandbox_network: true
  allowed_roots: []         # e.g. ["~/projects", "~/Documents"]; empty = any directory
  confine_agents: true      # every agent is told its working directory and must ask before touching anything outside it
  audit: true               # ~/.local/state/openswarm/audit.log
  snapshots: true           # tar snapshot before in-place runs outside git -> "Undo this run"
  snapshot_limit_mb: 200
  permission_default: reject   # answer when nobody responds to a permission prompt in time

opencode:
  binary: opencode
  use_server: true          # warm `opencode serve` per directory (password-protected, localhost only)
  use_api: true             # chat through the HTTP API: permission prompts, tool cards, token/cost
  retries: 2                # rate-limit / overload retries with exponential backoff
  role_agents: {}           # optional: {planner: plan}
  link_mode: symlink
  timeout_seconds: 1800

# --- OpenRouter: several keys, switched automatically -------------------------------------------------------
# Use models as `openrouter/<vendor>/<model>` (see `openswarm --list-models`). Don't ALSO run `opencode auth login` for
# openrouter: a key stored there would override the keys below. Keys can instead come from the environment:
#   export OPENROUTER_API_KEYS="sk-or-v1-aaa,sk-or-v1-bbb,sk-or-v1-ccc"
openrouter:
  api_keys: []                    # - sk-or-v1-...   (one per line)
  strategy: failover              # failover: stay on a key until it fails | round_robin: spread agents over all keys
  rate_limit_cooldown_seconds: 60 # a rate-limited key rests this long
  quota_cooldown_seconds: 3600    # a key out of credits / daily quota rests this long
  max_wait_seconds: 120           # if every key is resting, wait at most this long

# --- your own pipelines: placeholders {request}, {<earlier step id>}, {item} (foreach) -------------------
workflows:
  - id: translate_check
    label: Translate + back-check
    description: Translate, then verify by translating back
    steps:
      - {id: translated, role: coder,   prompt: "Translate to English, keep formatting:\n{request}"}
      - {id: back,       role: planner, prompt: "Translate this back to the source language:\n{translated}"}
      - {id: report,     role: planner, result: true, prompt: "Compare ORIGINAL and BACK-TRANSLATION and list meaning drift. Then give the final English text.\nORIGINAL:\n{request}\nBACK:\n{back}\nENGLISH:\n{translated}"}

# --- run while `openswarm web` is open ----------------------------------------------------------------
schedules: []
#  - {id: morning-news, every: "daily 08:30", workdir: "~/notes", preset: researcher, prompt: "Summarise today's news about Arch Linux"}
triggers: []
#  - {id: inbox, watch: "~/Inbox", glob: "*.docx", preset: office, prompt: "Summarise @{file} into a 5-line brief"}
